<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
	<!-- The four Sanzo Wada inks in band order: indigo, rust, amber, mint.
	     Inline fills are the light-theme values; the media query applies the
	     same dark-theme lift the site uses (indigo/rust toward white). -->
	<rect class="indigo" fill="#202D85" x="0" y="0" width="8" height="32" />
	<rect class="rust" fill="#A93400" x="8" y="0" width="8" height="32" />
	<rect fill="#FFAB00" x="16" y="0" width="8" height="32" />
	<rect fill="#00CF91" x="24" y="0" width="8" height="32" />
	<style>
		@media (prefers-color-scheme: dark) {
			.indigo { fill: #848CBC; }
			.rust { fill: #C77B59; }
		}
	</style>
</svg>
